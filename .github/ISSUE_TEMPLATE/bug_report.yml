name: Bug report
description: Report something that isn't working correctly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for helping improve Orrery. Please do not include API keys or personal financial data."
  - type: input
    id: version
    attributes:
      label: Version
      description: "From `check_for_updates` or the plugin.json version"
      placeholder: "2.3.0"
    validations: { required: true }
  - type: dropdown
    id: env
    attributes:
      label: Environment
      options: ["Claude desktop (Cowork)", "Claude Code (CLI)", "Other"]
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what actually happened?
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
  - type: textarea
    id: report
    attributes:
      label: Test report (optional)
      description: "Output of `run_test_suite` if relevant"
