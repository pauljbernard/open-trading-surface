name: 💡 Product idea
description: Share an idea, workflow, or direction for Orrery — anything from a small tweak to a new capability.
title: "[Idea]: "
labels: ["idea", "feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Orrery is being shaped by the people who use it. Rough ideas are welcome — you don't need a full spec.
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like Orrery to do (or do differently)?
      placeholder: "It would help if Orrery could…"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: What are you trying to accomplish? What's painful today?
    validations:
      required: false
  - type: dropdown
    id: role
    attributes:
      label: How do you use Orrery?
      options:
        - Individual / independent investor
        - Professional (advisor, analyst, PM, trader)
        - Student / learning
        - Developer / builder
        - Other
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Examples, mockups, links, or related tools that do this well.
    validations:
      required: false
